# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.configuration-cache=true

java_version=21
minecraft_version=1.21.1
#Used as a helper for porting when deps we use have not updated yet
previous_minecraft_version=1.20.6
previous_minor_minecraft_version=1.21
loader_version_range=[4,)
loader_version=0.16.14
fabric_version=0.116.5+1.21.1
mod_version=10.7.14
#This determines the minimum version of forge required to use Mekanism
# Only bump it whenever we need access to a feature in forge that is not available in earlier versions
neo_version_range=[21.1.176,)
minecraft_version_range=[1.21.1]
#This specifies what type of release it will be uploaded to CurseForge and Modrinth as
# options are: alpha, beta, release
release_type=alpha

port_lib_version=3.1.0-beta.75
port_lib_modules = attributes,base,brewing,client_events,client_extensions,core,common,config,entity,items,models,model_loader,resources,tags,transfer,item_abilities,registry,loot,chunk_loading,model_data,obj_loader,milk

